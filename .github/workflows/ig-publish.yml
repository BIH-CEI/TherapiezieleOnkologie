# IG-Build + GitHub Pages.
#
#   main            → ci-build/ (beweglicher Stand) + <VERSION>/ (Snapshot)
#                     + Wurzel-Redirect — die formale Veröffentlichung.
#   jeder andere    → branches/<branch>/ — eine gerenderte Vorschau pro Branch,
#   Branch            damit ein Stand ohne lokalen Build teilbar ist. Wurzel,
#                     ci-build/ und Versionsverzeichnisse bleiben unangetastet.
#
# Gelöschte Branch-Vorschauen räumt cleanup-gh-pages.yml wöchentlich ab; es
# erkennt sie am .branch-name-Marker, den jede Vorschau hier ablegt.
# Muster: MII-KDS-Modul-Template (kerndatensatz-bildgebung u. a.).
#
# Zwei unabhängige, parallel laufende Prüfungen auf jedem Branch:
#   validate → validator_cli über fsh-generated/, -forPublication, Ergebnis
#              gefiltert als Markdown in der Job-Summary (fail fast, gut lesbar).
#   build    → IG Publisher; seine QA (output/qa.html) prüft im vollen
#              IG-Kontext inkl. Snapshots, Seitenlinks und Beispielen und ist
#              bei Bundle-/Snapshot-Fragen die Autorität. Liegt in jeder
#              Vorschau unter branches/<branch>/qa.html.
name: Build IG & Publish to GitHub Pages

on:
  push:
    branches:
      - "**"
      - "!gh-pages"
      - "!fsh-generated"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  checks: write
  pull-requests: write # Vorschau-URL als PR-Kommentar
  issues: write # PR-Kommentare laufen über die Issues-API

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Standalone-Validierung (validator_cli, -forPublication) auf JEDEM Branch —
  # inhaltliche Änderungen sollen nicht erst auf main auffallen. Läuft parallel
  # zu build: das Gating lag ohnehin nie hier (build hatte `if: always()`), die
  # Abhängigkeit hätte die Vorschau nur verzögert.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SUSHI
        run: npm install -g fsh-sushi@${{ vars.SUSHI_VERSION || '3.20.1' }}

      - name: Cache FHIR packages
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('sushi-config.yaml') }}
          restore-keys: fhir-packages-

      - name: Run SUSHI
        run: sushi .

      - name: Cache Java Validator
        id: cache-validator
        uses: actions/cache@v4
        with:
          path: validator_cli.jar
          key: validator-${{ vars.JAVA_VALIDATOR_VERSION || '6.5.7' }}

      - name: Download Java Validator
        if: steps.cache-validator.outputs.cache-hit != 'true'
        run: |
          JAVA_VALIDATOR_VERSION="${{ vars.JAVA_VALIDATOR_VERSION || '6.5.7' }}"
          wget -q "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${JAVA_VALIDATOR_VERSION}/validator_cli.jar" -O validator_cli.jar

      # Terminologie-Antworten zwischen Läufen cachen — ohne diesen Cache geht jede
      # $validate-code/$expand-Anfrage einzeln gegen den TX-Server (>30 min, Timeout).
      - name: Cache Terminologie-Antworten (txcache)
        uses: actions/cache@v4
        with:
          path: input-cache/txcache
          key: txcache-validate-${{ github.run_id }}
          restore-keys: |
            txcache-validate-
            txcache-

      # Terminologieserver: MII SU-TermServ via mTLS-nginx-Proxy, sobald das
      # Client-Zertifikat als Secret hinterlegt ist (MII_TERMSERV_CERT als
      # base64-p12, MII_TERMSERV_PW als Passwort); sonst Fallback tx.fhir.org.
      # Muster: SenologieOnFHIR bzw. MII kerndatensatz-meta.
      - name: Setup TX Proxy (MII Ontoserver)
        id: txproxy
        env:
          MII_TERMSERV_CERT: ${{ secrets.MII_TERMSERV_CERT }}
          MII_TERMSERV_PW: ${{ secrets.MII_TERMSERV_PW }}
        run: |
          if [ -z "$MII_TERMSERV_CERT" ]; then
            echo "Kein MII-TermServ-Zertifikat hinterlegt — Validierung gegen tx.fhir.org."
            echo "tx=http://tx.fhir.org" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p nginx/certs
          curl -sSL -o nginx/nginx.conf \
            https://raw.githubusercontent.com/medizininformatik-initiative/kerndatensatz-meta/refs/heads/master/.github/workflows/nginx.conf
          echo "$MII_TERMSERV_CERT" | base64 -d > nginx/certs/client.p12
          openssl pkcs12 -in nginx/certs/client.p12 -clcerts -nokeys \
            -out nginx/certs/client-cert.pem -passin pass:$MII_TERMSERV_PW
          openssl pkcs12 -in nginx/certs/client.p12 -nocerts \
            -out nginx/certs/client-key-encrypted.key \
            -passin pass:$MII_TERMSERV_PW -passout pass:$MII_TERMSERV_PW
          openssl rsa -in nginx/certs/client-key-encrypted.key \
            -out nginx/certs/client-key.key -passin pass:$MII_TERMSERV_PW
          docker run -d --name nginx-proxy \
            -v $PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v $PWD/nginx/certs:/etc/nginx/certs:ro \
            -p 8090:80 nginx:alpine
          sleep 5
          for i in {1..5}; do
            if curl --silent --fail http://localhost:8090/fhir/metadata > /dev/null; then
              echo "NGINX TX proxy is ready."
              echo "tx=http://localhost:8090/fhir" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for NGINX... attempt $i"
            sleep 2
          done
          echo "Proxy nicht erreichbar — Fallback auf tx.fhir.org."
          echo "tx=http://tx.fhir.org" >> "$GITHUB_OUTPUT"

      - name: Run Java Validator
        run: |
          IG_DEPS=$(jq -r '(.dependencies // {}) | to_entries | map("-ig " + .key + "#" + .value) | join(" ")' package.json)
          UNESCAPED_IG_DEPS=$(echo $IG_DEPS | tr -d '"')
          mkdir -p input-cache/txcache
          java -jar validator_cli.jar \
            fsh-generated/resources/*.json \
            -version 4.0 \
            -txCache input-cache/txcache \
            -expansion-parameters .github/expansion-parameters.json \
            ${{ vars.JAVA_VALIDATION_OPTIONS || '-output-style compact -advisor-file advisor.json -resolution-context file:fsh-generated/resources/ -show-message-ids -txLog txlog.html -forPublication -verbose -html-output validation.html -output validation.json' }} \
            $UNESCAPED_IG_DEPS \
            -ig fsh-generated/resources \
            -tx ${{ steps.txproxy.outputs.tx }} || true

      - name: Render Validation Results
        if: always()
        uses: patrick-werner/validation-outcome-markdown-renderer@v1
        with:
          bundle-file: validation.json
          include: errors
          filters: |
            # Profile without snapshot (validator cannot validate without snapshot)
            ||*has no snapshot*|
            # Folge fehlender Parent-Snapshots (MII) im Standalone-Kontext
            ||*unable to determine the type it applies to*|
            # Mapping-Identitäts-URIs (z. B. http://hl7.org/fhir am Logical Model) sind nicht auflösbar — kein Inhaltsfehler
            ||*No definition could be found for URL value*|
            # Bundle-interne Profil-Matches scheitern am fehlenden MII-Parent-Snapshot im Standalone-Validator;
            # der IG Publisher validiert dieselben Bundles mit vollem Snapshot-Kontext auf 0 Errors (Autorität)
            ||*Unable to find a profile match for*|
            # tx.fhir.org kann deutsche CodeSysteme (ICD-10-GM/BfArM) nicht expandieren — required-Bindings
            # auf MII-ValueSets scheitern an validen Codes. Entfällt mit der SU-TermServ-Anbindung (mTLS).
            ||*was not found in the value set*|
            # Wrong Display Name (case sensitivity, TX version mismatch)
            ||*Wrong Display Name*|
            # Unknown codes (TX server LOINC/SNOMED version)
            ||*Unknown code*|
            # IG-Publisher-Parameter (copyrightyear, releaselabel, i18n-*, translation-sources, excludettl) wurden erst post-R4 zur GuideParameterCode-Liste hinzugefügt; R4-Strikt-Validierung kennt sie nicht
            ||*GuideParameterCode*|
            ||*guide-parameter-code*|
            # tx.fhir.org-Infrastrukturfehler (Timeout, verfallene Session-Cache, Sprachcode-Auflösung) — kein Inhaltsfehler, nur Server-Flakiness
            ||*is not known to this server*|
            ||*SocketTimeoutException*|
            ||*timeout*|
            ||*could not be determined for the code 'en'*|
            ||*Unable to connect to terminology server*|

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-output
          path: |
            txlog.html
            validation.html
            validation.json
          retention-days: 7

  # Der IG-Publisher-Build erzeugt seine eigene QA (output/qa.html) im vollen
  # IG-Kontext und ist für Bundle-/Snapshot-Fragen die Autorität; er läuft
  # unabhängig von validate.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SUSHI
        run: npm install -g fsh-sushi@${{ vars.SUSHI_VERSION || '3.20.1' }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Jekyll
        run: gem install jekyll

      - name: Cache FHIR packages
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('sushi-config.yaml') }}
          restore-keys: fhir-packages-

      - name: Cache IG Publisher JAR
        uses: actions/cache@v4
        id: cache-publisher
        with:
          path: input-cache/publisher.jar
          key: ig-publisher-${{ vars.PUBLISHER_VERSION || '2.3.4' }}

      - name: Download IG Publisher
        if: steps.cache-publisher.outputs.cache-hit != 'true'
        run: |
          mkdir -p input-cache
          curl -L -o input-cache/publisher.jar \
            https://github.com/HL7/fhir-ig-publisher/releases/download/${{ vars.PUBLISHER_VERSION || '2.3.4' }}/publisher.jar

      # Der IG Publisher liest/schreibt input-cache/txcache automatisch.
      - name: Cache Terminologie-Antworten (txcache)
        uses: actions/cache@v4
        with:
          path: input-cache/txcache
          key: txcache-build-${{ github.run_id }}
          restore-keys: |
            txcache-build-
            txcache-

      # Ohne diesen Schritt lief der IG Publisher immer gegen tx.fhir.org — dort
      # ist ICD-10-GM (BfArM-lizenziert) nicht expandierbar, was in qa.html die
      # Condition-Beispiele durchfallen ließ und als Folge jede Referenz auf sie.
      # Muster wie im validate-Job und in SenologieOnFHIR.
      - name: Setup TX Proxy (MII Ontoserver)
        id: txproxy
        env:
          MII_TERMSERV_CERT: ${{ secrets.MII_TERMSERV_CERT }}
          MII_TERMSERV_PW: ${{ secrets.MII_TERMSERV_PW }}
        run: |
          if [ -z "$MII_TERMSERV_CERT" ]; then
            echo "::warning::Kein MII-TermServ-Zertifikat — Build gegen tx.fhir.org; ICD-10-GM-Bindings werden in qa.html als Fehler erscheinen."
            echo "tx=http://tx.fhir.org" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p nginx/certs
          curl -sSL -o nginx/nginx.conf \
            https://raw.githubusercontent.com/medizininformatik-initiative/kerndatensatz-meta/refs/heads/master/.github/workflows/nginx.conf
          echo "$MII_TERMSERV_CERT" | base64 -d > nginx/certs/client.p12
          openssl pkcs12 -in nginx/certs/client.p12 -clcerts -nokeys \
            -out nginx/certs/client-cert.pem -passin pass:$MII_TERMSERV_PW
          openssl pkcs12 -in nginx/certs/client.p12 -nocerts \
            -out nginx/certs/client-key-encrypted.key \
            -passin pass:$MII_TERMSERV_PW -passout pass:$MII_TERMSERV_PW
          openssl rsa -in nginx/certs/client-key-encrypted.key \
            -out nginx/certs/client-key.key -passin pass:$MII_TERMSERV_PW
          docker run -d --name nginx-proxy-build \
            -v $PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v $PWD/nginx/certs:/etc/nginx/certs:ro \
            -p 8090:80 nginx:alpine
          sleep 5
          for i in {1..5}; do
            if curl --silent --fail http://localhost:8090/fhir/metadata > /dev/null; then
              echo "NGINX TX proxy is ready."
              echo "tx=http://localhost:8090/fhir" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for NGINX... attempt $i"
            sleep 2
          done
          echo "::warning::Proxy nicht erreichbar — Fallback auf tx.fhir.org."
          echo "tx=http://tx.fhir.org" >> "$GITHUB_OUTPUT"

      - name: Build IG
        run: |
          chmod +x _build.sh
          # -fhir-settings: der Publisher (2.3.1+) verweigert sonst ein
          # -tx-Ziel im privaten Netz per HTTP. Ohne den lokalen Proxy ist der
          # Parameter wirkungslos, stört aber nicht.
          ./_build.sh build \
            -tx ${{ steps.txproxy.outputs.tx }} \
            -fhir-settings "${GITHUB_WORKSPACE}/.github/fhir-settings.json"

      - name: Stop TX Proxy
        if: always()
        run: docker rm --force nginx-proxy-build > /dev/null 2>&1 || true

      - name: Deploy Build to GitHub Pages
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Version aus sushi-config lesen (z. B. 1.0.0-ballot) für den versionierten
          # Pfad — zwingend VOR dem Branch-Wechsel: auf gh-pages gibt es die Datei nicht.
          VERSION=$(grep -E '^version:' sushi-config.yaml | head -1 | awk '{print $2}')
          # Discard build-generated changes to tracked files (e.g. translations/)
          # before switching branches. output/ is untracked and survives.
          git checkout -- . 2>/dev/null || true
          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git checkout -f gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi
          # Pages soll die fertige IG-Ausgabe unverändert ausliefern statt sie
          # noch einmal durch Jekyll zu schicken (sonst fallen u. a. Pfade mit
          # führendem _ heraus).
          touch .nojekyll
          if [ "$BRANCH" = "main" ]; then
            if [ -z "$VERSION" ]; then
              echo "::error::Keine version in sushi-config.yaml gefunden"; exit 1
            fi
            # ci-build = beweglicher Stand von main; "$VERSION"/ = versionierter Snapshot (z. B. Ballot).
            # Bestehende andere Release-Versionen bleiben unangetastet.
            rm -rf ci-build
            cp -r output ci-build
            rm -rf "$VERSION"
            cp -r output "$VERSION"
            # Wurzel-Redirect auf die versionierte Ballot-Ausgabe (der Link, der geteilt wird)
            echo "<html><head><meta http-equiv=\"refresh\" content=\"0; url=${VERSION}/index.html\"></head><body>Redirecting to <a href=\"${VERSION}/index.html\">${VERSION}</a></body></html>" > index.html
            git add -A ci-build "$VERSION" index.html .nojekyll
            MSG="publish ${VERSION}: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          else
            # Branch-Vorschau: nur branches/<branch>/ wird angefasst; Wurzel,
            # ci-build/ und Versionsverzeichnisse bleiben, wie sie sind. Der
            # Branchname darf Schrägstriche enthalten (feature/xy) — mkdir -p
            # legt die Verschachtelung an.
            rm -rf "branches/${BRANCH}"
            mkdir -p "branches/${BRANCH}"
            cp -r output/. "branches/${BRANCH}/"
            # Marker, an dem cleanup-gh-pages.yml gelöschte Branches erkennt
            echo "${BRANCH}" > "branches/${BRANCH}/.branch-name"
            git add -A branches .nojekyll
            MSG="preview ${BRANCH}: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          git commit -m "$MSG" --allow-empty
          git push origin gh-pages

      - name: Vorschau-URL melden
        if: ${{ github.ref_name != 'main' }}
        run: |
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/branches/${GITHUB_REF_NAME}"
          {
            echo "Vorschau: ${BASE}/"
            echo "QA-Report: ${BASE}/qa.html"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Vorschau-URL als PR-Kommentar
        if: ${{ github.ref_name != 'main' }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = process.env.BRANCH_NAME;
            const marker = '<!-- ig-preview-url -->';
            const url = `https://${owner}.github.io/${repo}/branches/${branch}/`;
            const body = `${marker}\n### IG-Vorschau\n[Gerenderter IG für Branch \`${branch}\`](${url}) · [QA-Report](${url}qa.html)`;
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 });
            const pr = prs.find(p => p.head && p.head.ref === branch);
            if (!pr) { core.info(`Kein offener PR für ${branch} — kein Kommentar.`); return; }
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: pr.number, per_page: 100 });
            const existing = comments.find(c => typeof c.body === 'string' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
