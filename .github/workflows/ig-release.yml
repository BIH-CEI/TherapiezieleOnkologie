name: Release IG Version

# Release-Flow:
#   - GitHub-Release mit Tag 1.0.0-ballot-rc.1, -rc.2, … (Haken "pre-release") →
#     statischer Snapshot unter gh-pages/<tag>/, Root-Redirect bleibt unberührt.
#   - Finales GitHub-Release mit Tag 1.0.0-ballot (kein pre-release-Haken) →
#     Snapshot unter gh-pages/1.0.0-ballot/ UND Root-Redirect zeigt darauf.
#   Ein führendes "v" im Tag wird entfernt. Manuell via workflow_dispatch möglich.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (z. B. 1.0.0-ballot-rc.1)'
        required: true
      prerelease:
        description: 'Als Pre-Release behandeln (Root-Redirect nicht anfassen)'
        type: boolean
        default: true

permissions:
  contents: write

# Gleiche Gruppe wie ig-publish: nie zwei gleichzeitige gh-pages-Pushes
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SUSHI
        run: npm install -g fsh-sushi@${{ vars.SUSHI_VERSION || '3.20.1' }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Jekyll
        run: gem install jekyll

      - name: Cache FHIR packages
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('sushi-config.yaml') }}
          restore-keys: fhir-packages-

      - name: Cache IG Publisher JAR
        uses: actions/cache@v4
        id: cache-publisher
        with:
          path: input-cache/publisher.jar
          key: ig-publisher-${{ vars.PUBLISHER_VERSION || '2.3.4' }}

      - name: Download IG Publisher
        if: steps.cache-publisher.outputs.cache-hit != 'true'
        run: |
          mkdir -p input-cache
          curl -L -o input-cache/publisher.jar \
            https://github.com/HL7/fhir-ig-publisher/releases/download/${{ vars.PUBLISHER_VERSION || '2.3.4' }}/publisher.jar

      # Terminologie-Cache wie im Publish-Workflow — ohne ihn läuft der
      # Publisher-Build gegen tx.fhir.org in Richtung Timeout.
      - name: Cache Terminologie-Antworten (txcache)
        uses: actions/cache@v4
        with:
          path: input-cache/txcache
          key: txcache-release-${{ github.run_id }}
          restore-keys: |
            txcache-release-
            txcache-build-
            txcache-

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            PRERELEASE="${{ github.event.release.prerelease }}"
          else
            VERSION="${{ github.event.inputs.version }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION (prerelease: $PRERELEASE)"

      # Der Snapshot soll sich selbst korrekt ausweisen: sushi-config-Version
      # auf den Release-Tag setzen (z. B. 1.0.0-ballot-rc.1 statt 1.0.0-ballot).
      - name: Stamp release version into sushi-config
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version: .*/version: $VERSION/" sushi-config.yaml
          grep '^version:' sushi-config.yaml

      # Wie im Publish-Workflow: ohne den Proxy läuft der Publisher gegen
      # tx.fhir.org und der veröffentlichte Snapshot trüge ICD-10-GM-Fehler.
      - name: Setup TX Proxy (MII Ontoserver)
        id: txproxy
        env:
          MII_TERMSERV_CERT: ${{ secrets.MII_TERMSERV_CERT }}
          MII_TERMSERV_PW: ${{ secrets.MII_TERMSERV_PW }}
        run: |
          if [ -z "$MII_TERMSERV_CERT" ]; then
            echo "::warning::Kein MII-TermServ-Zertifikat — Release-Build gegen tx.fhir.org."
            echo "tx=http://tx.fhir.org" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p nginx/certs
          curl -sSL -o nginx/nginx.conf \
            https://raw.githubusercontent.com/medizininformatik-initiative/kerndatensatz-meta/refs/heads/master/.github/workflows/nginx.conf
          echo "$MII_TERMSERV_CERT" | base64 -d > nginx/certs/client.p12
          openssl pkcs12 -in nginx/certs/client.p12 -clcerts -nokeys \
            -out nginx/certs/client-cert.pem -passin pass:$MII_TERMSERV_PW
          openssl pkcs12 -in nginx/certs/client.p12 -nocerts \
            -out nginx/certs/client-key-encrypted.key \
            -passin pass:$MII_TERMSERV_PW -passout pass:$MII_TERMSERV_PW
          openssl rsa -in nginx/certs/client-key-encrypted.key \
            -out nginx/certs/client-key.key -passin pass:$MII_TERMSERV_PW
          docker run -d --name nginx-proxy-release \
            -v $PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v $PWD/nginx/certs:/etc/nginx/certs:ro \
            -p 8090:80 nginx:alpine
          sleep 5
          for i in {1..5}; do
            if curl --silent --fail http://localhost:8090/fhir/metadata > /dev/null; then
              echo "NGINX TX proxy is ready."
              echo "tx=http://localhost:8090/fhir" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for NGINX... attempt $i"
            sleep 2
          done
          echo "::warning::Proxy nicht erreichbar — Fallback auf tx.fhir.org."
          echo "tx=http://tx.fhir.org" >> "$GITHUB_OUTPUT"

      - name: Build IG
        run: |
          chmod +x _build.sh
          ./_build.sh build \
            -tx ${{ steps.txproxy.outputs.tx }} \
            -fhir-settings "${GITHUB_WORKSPACE}/.github/fhir-settings.json"

      - name: Stop TX Proxy
        if: always()
        run: docker rm --force nginx-proxy-release > /dev/null 2>&1 || true

      - name: Deploy Release to GitHub Pages
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PRERELEASE="${{ steps.version.outputs.prerelease }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Build-generierte Änderungen an getrackten Dateien (translations/,
          # sushi-config-Stempel) verwerfen, sonst scheitert der Branch-Wechsel.
          git checkout -- . 2>/dev/null || true
          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git checkout -f gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi
          # Wie im Publish-Workflow: Pages soll die IG-Ausgabe unverändert
          # ausliefern, nicht noch einmal durch Jekyll schicken.
          touch .nojekyll
          git add .nojekyll
          # Statischer, versionierter Snapshot — bestehende Releases bleiben unangetastet
          if [ -d "$VERSION" ]; then
            echo "WARNUNG: Version $VERSION existiert bereits und wird ersetzt"
            rm -rf "$VERSION"
          fi
          cp -r output "$VERSION"
          git add "$VERSION/"
          # Root-Redirect nur beim finalen Release (kein Pre-Release)
          if [ "$PRERELEASE" != "true" ]; then
            echo "<html><head><meta http-equiv=\"refresh\" content=\"0; url=${VERSION}/index.html\"></head><body>Redirecting to <a href=\"${VERSION}/index.html\">${VERSION}</a> | <a href=\"ci-build/index.html\">CI Build</a></body></html>" > index.html
            git add index.html
          fi
          git commit -m "release: ${VERSION}" --allow-empty
          git push origin gh-pages
