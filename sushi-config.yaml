id: bih-cei-therapieziele-onkologie
canonical: https://bih-cei.de/fhir/therapieziele-onkologie
name: TherapiezieleOnkologie
title: Implementierungsleitfaden Therapieziele Onkologie
description: Implementierungsleitfaden zur Dokumentation onkologischer Therapieziele in FHIR
status: draft # draft | active | retired | unknown
version: 0.1.0
packageId: de.bih-cei.therapieziele-onkologie
fhirVersion: 4.0.1 # https://www.hl7.org/fhir/valueset-FHIR-version.html
copyrightYear: 2026+
releaseLabel: ci-build
license: CC-BY-4.0 # https://www.hl7.org/fhir/valueset-spdx-license.html
jurisdiction: urn:iso:std:iso:3166#DE "Germany"
publisher:
  name: Berlin Institute of Health at Charité (BIH)
  url: https://www.bihealth.org

# ╭───────────────────────────────────── Dependencies ─────────────────────────────╮
# │ Abgleich mit dem MII Kerndatensatz-Modul Onkologie (v2026.0.3): Wiederverwendung │
# │ des onkologischen Diagnose-Profils (Primärtumor) als Basis für OnkoCondition.    │
# ╰────────────────────────────────────────────────────────────────────────────────╯
dependencies:
  de.medizininformatikinitiative.kerndatensatz.onkologie: 2026.0.3

# ╭───────────────────────────────────── Pages ────────────────────────────────────╮
# │ Default-language pages live in input/pagecontent/. Translated copies live in   │
# │ input/translations/de/pagecontent/ and are matched by filename.                │
# ╰────────────────────────────────────────────────────────────────────────────────╯
pages:
  index.md:
    title: Startseite
  therapieziele.md:
    title: Therapieziele (Goals)
  empfehlung-behandlung.md:
    title: Empfehlungs- und Behandlungsplan
  behandlungsepisode.md:
    title: Behandlungsepisoden (EpisodeOfCare)
  goal-target-measure.md:
    title: Zielwerte und Messgrößen
  szenario-crc.md:
    title: Anwendungsbeispiel (mCRC palliativ)
  szenario-mamma.md:
    title: Anwendungsbeispiel (Mammakarzinom neoadjuvant)
  entitaet-diabetes.md:
    title: Weitere Entität – Diabetes mellitus
  entitaet-asthma.md:
    title: Weitere Entität – Asthma bronchiale
  entitaet-ced.md:
    title: Weitere Entität – Chronisch-entzündliche Darmerkrankungen
  entitaet-rheuma.md:
    title: Weitere Entität – Rheumatoide Arthritis
  analysebericht.md:
    title: Analysebericht (LG-01)
  translationinfo.md:
    title: Hinweise zur Übersetzung

# ╭────────────────────────────── IG Publisher Parameters ─────────────────────────╮
# │ i18n-* parameters enable the language switcher in the rendered IG.             │
# │ Reference: https://build.fhir.org/ig/FHIR/ig-guidance/languages.html           │
# ╰────────────────────────────────────────────────────────────────────────────────╯
parameters:
  i18n-default-lang: de           # primary/default language of the IG
  i18n-lang:
    - en                          # additional languages
  translation-sources:
    - input/translations/en       # path with .po files and translated pagecontent
  excludettl: true

menu:
  Startseite: index.html
  Konzepte:
    Therapieziele: therapieziele.html
    Empfehlungs- und Behandlungsplan: empfehlung-behandlung.html
    Behandlungsepisoden: behandlungsepisode.html
    Zielwerte & Messgrößen: goal-target-measure.html
  Anwendungsbeispiele:
    mCRC (palliativ): szenario-crc.html
    Mammakarzinom (neoadjuvant): szenario-mamma.html
  Weitere Entitäten:
    Diabetes mellitus: entitaet-diabetes.html
    Asthma bronchiale: entitaet-asthma.html
    Chronisch-entzündliche Darmerkrankungen: entitaet-ced.html
    Rheumatoide Arthritis: entitaet-rheuma.html
  Analysebericht: analysebericht.html
  Artefakte: artifacts.html

instanceOptions:
  manualSliceOrdering: true
