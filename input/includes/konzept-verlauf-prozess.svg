<svg width="100%" viewBox="0 0 940 640" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Aptos','Segoe UI',system-ui,sans-serif">
<title>Therapieziele Onkologie — Profile und Verlauf</title>
<desc>Prozessdiagramm im Stil der Originalgrafik: Von der Diagnose ueber Therapieziel festlegen, Behandlungsepisode anlegen, Versorgungsplan erstellen zu Verlauf bewerten; Entscheidung Ziel erreicht oder Linienwechsel. Gruene Kreislaeufe fuer Linienwechsel und Strategiewechsel mit neuem uebergeordnetem Ziel. FHIR-Ressourcen als Datenobjekte, rote gestrichelte outcomeReference von der Observation zum Goal. Seitliche Wertebereiche Zielart und zweiachsige Intention.</desc>
