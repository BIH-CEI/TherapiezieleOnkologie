<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Aptos','Segoe UI',system-ui,sans-serif">
<title>Referenzgraph (Therapie-Kern) des Beispiel-Szenarios mCRC palliativ</title>
<desc>Orthogonal gelegter Referenzgraph: links die Quellen CarePlan und Therapielinie, in der Mitte Ziele und Systemtherapie, rechts Diagnose, Verlaufs-Observation und Akteure. Jede Referenz verlaesst ihre Quelle an einem eigenen Port mit Feldnamen-Beschriftung auf freiem Segment; die subject-Referenzen aller Ressourcen auf die Patientin sind als gestrichelter Hinweis zusammengefasst.</desc>
<defs>
