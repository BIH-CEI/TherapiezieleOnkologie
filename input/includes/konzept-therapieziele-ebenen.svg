<svg width="100%" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Aptos','Segoe UI',system-ui,sans-serif">
<title>Zwei Ebenen der Therapieziele und der Strategiewechsel</title>
<desc>Ebene 1: genau ein aktives uebergeordnetes Behandlungsziel je Zeitpunkt; beim Strategiewechsel (Progress) wird es abgeschlossen und durch ein neues ersetzt (replacement). Ebene 2: optionale Episodenziele je Behandlungsabschnitt, bei erfolgreichem Abschluss als Journey verkettet (successor). Unten der Zeitpfeil.</desc>
<defs>
<marker id="arp" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#534AB7"/></marker>
<marker id="argn" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#0F6E56"/></marker>
<marker id="argr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5F5E5A"/></marker>
</defs>

<text x="40" y="26" font-size="11.5" font-weight="500" fill="#5F5E5A">Ebene 1 — übergeordnetes Behandlungsziel (genau ein aktives je Zeitpunkt)</text>

<g><rect x="40" y="36" width="270" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
<text x="175" y="58" text-anchor="middle" font-size="12.5" font-weight="500" fill="#04342C">Übergeordnet: kurativ</text>
<text x="175" y="75" text-anchor="middle" font-size="10" fill="#0F6E56">Heilung angestrebt</text></g>
<text x="175" y="105" text-anchor="middle" font-size="9.5" fill="#5F5E5A">abgeschlossen: cancelled + not-attainable</text>

<line x1="314" y1="63" x2="366" y2="63" stroke="#534AB7" stroke-width="1.8" marker-end="url(#arp)"/>
<text x="340" y="52" text-anchor="middle" font-size="9.5" font-weight="500" fill="#534AB7">replacement</text>

<g><rect x="370" y="36" width="270" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
<text x="505" y="58" text-anchor="middle" font-size="12.5" font-weight="500" fill="#04342C">Übergeordnet: palliativ</text>
<text x="505" y="75" text-anchor="middle" font-size="9.5" fill="#0F6E56">Lebensverlängerung · Symptomkontrolle</text></g>

<line x1="340" y1="96" x2="340" y2="124" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="5,4"/>
<line x1="340" y1="142" x2="340" y2="252" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="348" y="112" font-size="9.5" fill="#5F5E5A">Progress</text>

<text x="40" y="136" font-size="11.5" font-weight="500" fill="#5F5E5A">Ebene 2 — Episodenziele (optional, dem Behandlungsabschnitt zugeordnet)</text>

<g><rect x="40" y="146" width="125" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
<text x="102" y="168" text-anchor="middle" font-size="10" font-weight="500" fill="#04342C">Tumorverkleinerung</text>
<text x="102" y="184" text-anchor="middle" font-size="9.5" fill="#0F6E56">neoadjuvant</text></g>

<line x1="167" y1="173" x2="183" y2="173" stroke="#0F6E56" stroke-width="1.6" marker-end="url(#argn)"/>

<g><rect x="185" y="146" width="125" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
<text x="247" y="168" text-anchor="middle" font-size="11" font-weight="500" fill="#04342C">Rezidivfreiheit</text>
<text x="247" y="184" text-anchor="middle" font-size="9.5" fill="#0F6E56">Nachsorge</text></g>

<g><rect x="370" y="146" width="190" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
<text x="465" y="168" text-anchor="middle" font-size="11.5" font-weight="500" fill="#04342C">Symptomkontrolle</text>
<text x="465" y="184" text-anchor="middle" font-size="9.5" fill="#0F6E56">1. palliative Linie</text></g>

<line x1="40" y1="252" x2="628" y2="252" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#argr)"/>
<text x="640" y="256" font-size="11" fill="#5F5E5A">Zeit</text>

<text x="40" y="282" font-size="10.5" fill="#5F5E5A">Strategiewechsel (Progress): das übergeordnete Ziel wird abgeschlossen und durch ein neues ersetzt (replacement) —</text>
<text x="40" y="298" font-size="10.5" fill="#5F5E5A">die Historie „erst kurativ, dann palliativ“ bleibt erhalten. Erfolgreiche Ziele verketten sich als Journey (successor).</text>

<rect x="40" y="322" width="13" height="13" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="59" y="333" font-size="11" fill="#5F5E5A">Ziel</text>
<line x1="100" y1="328" x2="130" y2="328" stroke="#0F6E56" stroke-width="1.6" marker-end="url(#argn)"/><text x="136" y="333" font-size="11" fill="#5F5E5A">successor (Journey)</text>
<line x1="250" y1="328" x2="280" y2="328" stroke="#534AB7" stroke-width="1.8" marker-end="url(#arp)"/><text x="286" y="333" font-size="11" fill="#5F5E5A">replacement (Pivot)</text>
<line x1="400" y1="328" x2="430" y2="328" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="5,4"/><text x="436" y="333" font-size="11" fill="#5F5E5A">klinisches Ereignis</text>
</svg>
