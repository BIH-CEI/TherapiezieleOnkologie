<svg width="100%" viewBox="0 0 680 545" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Aptos','Segoe UI',system-ui,sans-serif">
<title>Recommendation and treatment plan: two roles of CarePlan</title>
<desc>On the left the coarse-grained recommendation of the tumour board (RecommendationCarePlan, intent proposal) with the overarching goal; on the right the fine-grained treatment plans of autonomous providers (intent order) with episode goals. Linked through basedOn at plan and request level; deliberately no partOf.</desc>
<defs>
<marker id="arp" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#534AB7"/></marker>
</defs>

<text x="40" y="24" font-size="12" font-weight="500" fill="#5F5E5A">Recommendation — tumour board</text>
<text x="390" y="24" font-size="12" font-weight="500" fill="#5F5E5A">Treatment — autonomous providers</text>

<g><rect x="40" y="36" width="130" height="42" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/>
<text x="105" y="54" text-anchor="middle" font-size="11.5" font-weight="500" fill="#2C2C2A">Tumour board</text>
<text x="105" y="69" text-anchor="middle" font-size="9" fill="#5F5E5A">CareTeam</text></g>
<line x1="105" y1="80" x2="105" y2="97" stroke="#534AB7" stroke-width="1.6" marker-end="url(#arp)"/>

<g><rect x="40" y="100" width="260" height="160" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text x="170" y="122" text-anchor="middle" font-size="12.5" font-weight="500" fill="#26215C">RecommendationCarePlan</text>
<text x="170" y="137" text-anchor="middle" font-size="9.5" fill="#534AB7">intent: proposal — coarse-grained</text>
<rect x="58" y="148" width="224" height="24" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="170" y="164" text-anchor="middle" font-size="9.5" fill="#04342C">pursues: overarching goal (curative)</text>
<rect x="58" y="180" width="224" height="32" rx="5" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="170" y="193" text-anchor="middle" font-size="9.5" fill="#4A1B0C">Recommendation: platinum-based chemo</text>
<text x="170" y="205" text-anchor="middle" font-size="9" fill="#993C1D">+ checkpoint inhibitor — proposal</text>
<rect x="58" y="220" width="224" height="24" rx="5" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="170" y="236" text-anchor="middle" font-size="9.5" fill="#4A1B0C">Recommendation: surgery — proposal</text></g>

<g><rect x="390" y="60" width="250" height="150" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text x="515" y="82" text-anchor="middle" font-size="12.5" font-weight="500" fill="#26215C">TreatmentCarePlan ①</text>
<text x="515" y="97" text-anchor="middle" font-size="9" fill="#534AB7">neoadjuvant systemic therapy — custodian: Clinic A</text>
<rect x="406" y="108" width="218" height="24" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="515" y="124" text-anchor="middle" font-size="9.5" fill="#04342C">pursues: goal tumour shrinkage (→ surgery)</text>
<rect x="406" y="140" width="218" height="34" rx="5" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="515" y="153" text-anchor="middle" font-size="9.5" fill="#4A1B0C">MedicationRequest — order:</text>
<text x="515" y="166" text-anchor="middle" font-size="9" fill="#993C1D">Carboplatin AUC5 + Pembrolizumab q3w</text>
<text x="515" y="196" text-anchor="middle" font-size="9" fill="#5F5E5A">integration: pharmacy · scheduling</text></g>

<g><rect x="390" y="250" width="250" height="110" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text x="515" y="272" text-anchor="middle" font-size="12.5" font-weight="500" fill="#26215C">TreatmentCarePlan ②</text>
<text x="515" y="287" text-anchor="middle" font-size="9" fill="#534AB7">surgery — custodian: another organisation (Clinic B)</text>
<rect x="406" y="298" width="218" height="22" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="515" y="313" text-anchor="middle" font-size="9.5" fill="#04342C">pursues: goal R0 resection · ypCR</text>
<rect x="406" y="328" width="218" height="22" rx="5" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="515" y="343" text-anchor="middle" font-size="9.5" fill="#4A1B0C">ServiceRequest: surgery — order</text></g>

<line x1="388" y1="130" x2="304" y2="130" stroke="#534AB7" stroke-width="1.7" marker-end="url(#arp)"/>
<text x="346" y="120" text-anchor="middle" font-size="9.5" font-weight="500" fill="#534AB7">basedOn</text>

<path d="M388,300 L330,300 L330,264" fill="none" stroke="#534AB7" stroke-width="1.7" marker-end="url(#arp)"/>
<text x="352" y="292" text-anchor="middle" font-size="9.5" font-weight="500" fill="#534AB7">basedOn</text>

<line x1="404" y1="157" x2="286" y2="194" stroke="#534AB7" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arp)"/>
<text x="352" y="166" text-anchor="middle" font-size="8.5" fill="#534AB7">Request.basedOn</text>

<g><rect x="40" y="300" width="260" height="84" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/>
<text x="170" y="320" text-anchor="middle" font-size="10" font-weight="500" fill="#2C2C2A">no partOf — no central control</text>
<text x="170" y="336" text-anchor="middle" font-size="9.5" fill="#2C2C2A">the treatment plan fulfils the recommendation;</text>
<text x="170" y="350" text-anchor="middle" font-size="9.5" fill="#2C2C2A">decoupled in time and organisation</text>
<text x="170" y="364" text-anchor="middle" font-size="9" fill="#5F5E5A">(own custodian per plan)</text></g>

<g><rect x="40" y="398" width="600" height="78" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.3"/>
<text x="340" y="418" text-anchor="middle" font-size="10" font-weight="500" fill="#2C2C2A">Modelling note: activity.detail vs. standalone Requests</text>
<text x="340" y="435" text-anchor="middle" font-size="9.5" fill="#2C2C2A">The recommendations could in theory sit inline in the plan (CarePlan.activity.detail) —</text>
<text x="340" y="450" text-anchor="middle" font-size="9.5" fill="#2C2C2A">across sectors, profiling as recommendation ServiceRequest / recommendation MedicationRequest is preferable:</text>
<text x="340" y="465" text-anchor="middle" font-size="9.5" fill="#2C2C2A">referenceable, individually fulfillable (Request.basedOn) and exchangeable across organisations.</text></g>

<rect x="40" y="492" width="13" height="13" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="59" y="503" font-size="11" fill="#5F5E5A">Plan</text>
<rect x="100" y="492" width="13" height="13" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="119" y="503" font-size="11" fill="#5F5E5A">Goal reference</text>
<rect x="205" y="492" width="13" height="13" rx="3" fill="#FAECE7" stroke="#D85A30"/><text x="224" y="503" font-size="11" fill="#5F5E5A">Measure / Request</text>
<rect x="355" y="492" width="13" height="13" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="374" y="503" font-size="11" fill="#5F5E5A">Actor / note</text>

<text x="40" y="532" font-size="10" fill="#5F5E5A">One recommendation — several treatment plans: implementation at different organisations, linked via basedOn.</text>
</svg>
