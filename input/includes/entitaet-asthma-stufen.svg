<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Aptos','Segoe UI',system-ui,sans-serif">
<title>Asthma: zusammengesetztes Kontrollziel und GINA-Stufenschema (step-up / step-down)</title>
<desc>Oben das zusammengesetzte Ziel Asthmakontrolle (ACT, FEV1, keine schweren Anfaelle) und die regelmaessige Kontrollpruefung. Unten das GINA-Stufenschema als Treppe: bei fehlender Kontrolle hochstufen, bei anhaltender Kontrolle herunterstufen auf die geringste wirksame Stufe; Ziel des Herunterstufens ist der Verzicht auf Kortisontabletten.</desc>
<defs>
<marker id="arp" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#534AB7"/></marker>
<marker id="argn" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#0F6E56"/></marker>
<marker id="argr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5F5E5A"/></marker>
</defs>

<g><rect x="40" y="20" width="290" height="96" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="185" y="40" text-anchor="middle" font-size="12.5" font-weight="500" fill="#04342C">Ziel: Asthmakontrolle (zusammengesetzt)</text>
<text x="185" y="57" text-anchor="middle" font-size="11" fill="#04342C">ACT ≥ 20 (Beschwerden) — measure.text</text>
<text x="185" y="72" text-anchor="middle" font-size="11" fill="#04342C">FEV1: bester persönlicher Wert — LOINC 20150-9</text>
<text x="185" y="87" text-anchor="middle" font-size="11" fill="#04342C">0 schwere Anfälle pro Jahr — measure.text</text>
<text x="185" y="104" text-anchor="middle" font-size="10.5" fill="#0F6E56">ein Goal, mehrere target-Zeilen</text></g>

<line x1="388" y1="68" x2="332" y2="68" stroke="#534AB7" stroke-width="1.6" marker-end="url(#arp)"/>
<text x="360" y="60" text-anchor="middle" font-size="10.5" fill="#5F5E5A">Abgleich</text>

<g><rect x="390" y="32" width="250" height="72" rx="8" fill="#FAECE7" stroke="#D85A30"/>
<text x="515" y="54" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C">Kontrolle prüfen (alle 1–3 Monate)</text>
<text x="515" y="72" text-anchor="middle" font-size="10.5" fill="#4A1B0C">ACT · Spirometrie · Anfalls-Doku</text>
<text x="515" y="88" text-anchor="middle" font-size="10.5" fill="#993C1D">Observation → achievementStatus</text></g>

<path d="M515,106 L548,194" fill="none" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#argr)"/>
<text x="550" y="146" font-size="10.5" fill="#5F5E5A">Ergebnis</text>
<text x="550" y="160" font-size="10.5" fill="#5F5E5A">steuert die Stufe</text>

<line x1="95" y1="330" x2="540" y2="180" stroke="#534AB7" stroke-width="1.8" marker-end="url(#arp)"/>
<text x="60" y="236" font-size="10.5" fill="#534AB7">Kontrolle nicht erreicht →</text>
<text x="60" y="250" font-size="10.5" fill="#534AB7">hochstufen (step-up)</text>

<line x1="560" y1="250" x2="150" y2="392" stroke="#0F6E56" stroke-width="1.8" marker-end="url(#argn)"/>
<text x="460" y="330" font-size="10.5" fill="#0F6E56">kontrolliert (2–3 Monate) →</text>
<text x="460" y="344" font-size="10.5" fill="#0F6E56">herunterstufen (step-down)</text>

<g><rect x="40" y="350" width="96" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="88" y="375" text-anchor="middle" font-size="12.5" font-weight="500" fill="#26215C">Stufe 1</text></g>
<g><rect x="155" y="312" width="96" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="203" y="337" text-anchor="middle" font-size="12.5" font-weight="500" fill="#26215C">Stufe 2</text></g>
<g><rect x="270" y="274" width="96" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="318" y="299" text-anchor="middle" font-size="12.5" font-weight="500" fill="#26215C">Stufe 3</text></g>
<g><rect x="385" y="236" width="96" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="433" y="261" text-anchor="middle" font-size="12.5" font-weight="500" fill="#26215C">Stufe 4</text></g>
<g><rect x="500" y="198" width="96" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="548" y="223" text-anchor="middle" font-size="12.5" font-weight="500" fill="#26215C">Stufe 5</text></g>

<g><rect x="430" y="370" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="535" y="388" text-anchor="middle" font-size="11.5" font-weight="500" fill="#04342C">Ziel des Herunterstufens</text>
<text x="535" y="404" text-anchor="middle" font-size="10.5" fill="#04342C">ohne Kortisontabletten (OCS = 0)</text>
<text x="535" y="419" text-anchor="middle" font-size="10" fill="#0F6E56">target.detail · measure.text</text></g>

<text x="40" y="425" font-size="10.5" fill="#5F5E5A">GINA-Stufenschema: Therapieintensität —</text>
<text x="40" y="439" font-size="10.5" fill="#5F5E5A">Maßnahmen (MedicationRequest), nicht das Ziel</text>

<rect x="40" y="458" width="13" height="13" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="59" y="469" font-size="11.5" fill="#5F5E5A">Therapiestufe (Maßnahme)</text>
<rect x="230" y="458" width="13" height="13" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="249" y="469" font-size="11.5" fill="#5F5E5A">Ziel</text>
<rect x="295" y="458" width="13" height="13" rx="3" fill="#FAECE7" stroke="#D85A30"/><text x="314" y="469" font-size="11.5" fill="#5F5E5A">Messung</text>
<text x="400" y="469" font-size="10.5" fill="#5F5E5A">Scores ohne Code: measure.text</text>
</svg>
