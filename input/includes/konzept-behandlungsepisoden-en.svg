<svg width="100%" viewBox="0 0 680 396" role="img" xmlns="http://www.w3.org/2000/svg" font-family="'Aptos','Segoe UI',system-ui,sans-serif">
<title>Care episodes: one profile, three tracks — leading line and executing segment</title>
<desc>Timeline with care episodes in three tracks. Systemic track: the leading episode of the line (neoadjuvant, carries the EnLiST designation eLoT 1.0 together with the lineId) and the executing adjuvant segment (outpatient, same lineId, no designation of its own), chained via the lineId. Locoregional track: the perioperative episode (not-counted, overlapping in time; the surgery itself is a Procedure). Informative track: the diagnostics line. The bracket of the overall curative concept is formed by goal and plan, not by an episode.</desc>
<defs>
<marker id="argr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#5F5E5A"/></marker>
</defs>

<text x="40" y="22" font-size="11.5" font-weight="500" fill="#5F5E5A">One profile — many types: EpisodeOfCare.type distinguishes, the structure stays the same.</text>

<line x1="265" y1="40" x2="655" y2="40" stroke="#0F6E56" stroke-width="1.2"/>
<line x1="265" y1="40" x2="265" y2="45" stroke="#0F6E56" stroke-width="1.2"/>
<line x1="655" y1="40" x2="655" y2="45" stroke="#0F6E56" stroke-width="1.2"/>
<text x="460" y="35" text-anchor="middle" font-size="8.5" fill="#0F6E56">curative overall concept — bracket: goal + plan (no episode)</text>

<text x="30" y="66" font-size="10.5" font-weight="500" fill="#2C2C2A">systemic</text>
<text x="30" y="80" font-size="9" fill="#0F6E56">EnLiST — counts (LoT)</text>
<text x="30" y="138" font-size="10.5" font-weight="500" fill="#2C2C2A">locoregional</text>
<text x="30" y="152" font-size="9" fill="#5F5E5A">not counted in the</text>
<text x="30" y="164" font-size="9" fill="#5F5E5A">EnLiST framework</text>
<text x="30" y="214" font-size="10.5" font-weight="500" fill="#2C2C2A">informative /</text>
<text x="30" y="228" font-size="9" fill="#5F5E5A">management</text>

<line x1="140" y1="111" x2="655" y2="111" stroke="#C9C7C0" stroke-width="1" stroke-dasharray="2,5"/>
<line x1="140" y1="185" x2="655" y2="185" stroke="#C9C7C0" stroke-width="1" stroke-dasharray="2,5"/>

<line x1="404" y1="76" x2="518" y2="76" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="461" y="69" text-anchor="middle" font-size="7.5" fill="#534AB7">shared lineId</text>

<g><rect x="262" y="52" width="140" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text x="332" y="67" text-anchor="middle" font-size="9" font-weight="500" fill="#26215C">Systemic line — leading</text>
<text x="332" y="80" text-anchor="middle" font-size="8" fill="#26215C">neoadjuvant · inpatient (clinic)</text>
<text x="332" y="93" text-anchor="middle" font-size="8" fill="#534AB7">holds designation + lineId</text>
<rect x="352" y="45" width="52" height="13" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.1"/>
<text x="378" y="55" text-anchor="middle" font-size="7.5" font-weight="600" fill="#04342C">eLoT 1.0</text></g>

<g><rect x="520" y="52" width="135" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text x="587" y="67" text-anchor="middle" font-size="9" font-weight="500" fill="#26215C">Adjuvant segment</text>
<text x="587" y="80" text-anchor="middle" font-size="8" fill="#26215C">outpatient · pembrolizumab</text>
<text x="587" y="93" text-anchor="middle" font-size="8" fill="#534AB7">no designation of its own</text></g>

<g><rect x="415" y="126" width="110" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text x="470" y="141" text-anchor="middle" font-size="8.5" font-weight="500" fill="#26215C">Perioperative episode</text>
<circle cx="432" cy="153" r="3" fill="#534AB7"/>
<text x="440" y="156" font-size="7.5" fill="#534AB7">surgery = Procedure</text>
<text x="470" y="168" text-anchor="middle" font-size="7.5" fill="#5F5E5A">not-counted · overlaps</text></g>

<g><rect x="145" y="198" width="115" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text x="202" y="218" text-anchor="middle" font-size="10" font-weight="500" fill="#26215C">Diagnostics line</text>
<text x="202" y="233" text-anchor="middle" font-size="8.5" fill="#534AB7">type: diagnostics</text></g>

<line x1="145" y1="272" x2="648" y2="272" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#argr)"/>
<text x="674" y="276" text-anchor="end" font-size="10.5" fill="#5F5E5A">Time</text>

<text x="40" y="302" font-size="9.5" fill="#5F5E5A">Perioperative episode = the journey (planning → surgery → rehab); the surgery itself is a Procedure, visits are Encounter.</text>
<text x="40" y="318" font-size="9.5" fill="#5F5E5A">Only carriers of enlist-lot enter the LoT count (EnLiST) — locoregional lines and segments do not count.</text>
<text x="40" y="334" font-size="9.5" fill="#5F5E5A">The leading episode carries the designation (eLoT 1.0 + lineId); executing segments chain via the same lineId.</text>

<rect x="40" y="358" width="13" height="13" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="59" y="369" font-size="11" fill="#5F5E5A">Care episode (EpisodeOfCare — one profile)</text>
<rect x="322" y="358" width="36" height="13" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="364" y="369" font-size="11" fill="#5F5E5A">Designation</text>
<circle cx="452" cy="364" r="3" fill="#534AB7"/><text x="462" y="369" font-size="11" fill="#5F5E5A">Procedure</text>
<line x1="545" y1="364" x2="575" y2="364" stroke="#534AB7" stroke-width="1.2" stroke-dasharray="4,3"/><text x="581" y="369" font-size="11" fill="#5F5E5A">lineId chaining</text>
</svg>
